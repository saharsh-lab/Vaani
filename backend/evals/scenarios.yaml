# 50 scripted conversations with Sri Dental Clinic (app/seed.py).
#
# The clock is frozen at Monday 2 Nov 2026, 9:00 AM IST. Clinic hours are
# Mon-Sat 10:00-13:30 and 17:00-21:00, closed Sunday. Dr. Lakshmi does every
# service; Dr. Arjun works evenings and doesn't do RCT or braces.
# Dates: Tue 3 Nov = tomorrow (repu / kal), Wed 4 = day after (ellundi / parson),
# Thu 5, Fri 6, Sat 7, Sun 8 (closed), Mon 9.
#
# Each turn is what the customer types (or says, with `voice:`). Booking scripts
# end with an explicit "yes", since the agent must confirm before booking.
# Scenarios without booking expectations must leave all bookings untouched.

# --- Booking (15) -----------------------------------------------------------------

- id: book-rct-tomorrow-evening-te
  category: booking
  language: te
  turns:
    - "Namaskaram, repu sayantram RCT consultation ki appointment kavali"
    - "6 PM ki pettandi. Naa peru Ravi."
    - "Avunu, book cheyandi."
  expect:
    booking: {service: RCT consultation, start: "2026-11-03 18:00"}
    tools: [check_availability, create_booking]

