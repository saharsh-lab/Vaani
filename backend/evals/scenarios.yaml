    - "Sare. Repu sayantram general consultation dorukutunda?"
  expect:
    tools: [check_availability]
    judge: "The last reply is in Telugu (Telugu script or romanised Telugu) and offers evening times for tomorrow."

- id: switch-te-to-hi
  category: language_switch
  language: te>hi
  turns:
    - "Repu RCT consultation ki slots unnaya?"
    - "Hindi mein bataiye please."
  expect:
    judge: "The last reply is in Hindi (Devanagari or romanised Hindi)."

- id: switch-hi-to-en-booking
  category: language_switch
