# 100 labelled customer messages: the first tool the agent should call, and the
# arguments that must match. Each is sent on its own, over WhatsApp (number
# verified), with the clock frozen at Monday 2 Nov 2026, 9:00 AM IST.
#
# preferred_time: a window (morning / afternoon / evening) also matches a specific
# time inside it; a specific time must match exactly. Omitted args aren't checked.
# lang: en, te / hi (romanised), te-script (Telugu script), hi-script (Devanagari).

