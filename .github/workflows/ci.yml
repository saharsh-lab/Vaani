name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "30 21 * * *" # nightly evals, 3:00 AM IST
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaani_admin
          POSTGRES_PASSWORD: vaani_admin
          POSTGRES_DB: vaani
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaani_admin"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      TEST_PG: localhost:5432
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # also type-checks, after generating the route types
      - run: npm audit --omit=dev # nothing that ships to visitors has a known vulnerability

  # Every page, link, button and form in a real browser, on desktop and phone sizes,
  # against a production build and a fresh demo database (web/e2e).
  e2e:
    needs: [backend, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaani_admin
          POSTGRES_PASSWORD: vaani_admin
          POSTGRES_DB: vaani
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaani_admin"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      E2E_PG: localhost:5432
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ./backend
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npm run e2e
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          retention-days: 7

  # The agent against real Gemini: 50 scripted conversations and 100 labelled
  # utterances. Fails if booking success drops below 90%. Needs the
  # GEMINI_API_KEY repository secret; optional variables GEMINI_MODEL, EVAL_RPM.
  evals:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
    needs: backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: vaani_admin
          POSTGRES_PASSWORD: vaani_admin
          POSTGRES_DB: vaani
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vaani_admin"
          --health-interval 2s --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: backend
    env:
      EVAL_PG: localhost:5432
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
    steps:
      - name: Skip without an API key
        if: env.GEMINI_API_KEY == ''
        run: echo "::notice::Add a GEMINI_API_KEY repository secret to run the evals."
      - uses: actions/checkout@v4
        if: env.GEMINI_API_KEY != ''
      - uses: actions/setup-python@v5
        if: env.GEMINI_API_KEY != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - if: env.GEMINI_API_KEY != ''
        run: pip install -e ".[dev]"
      - name: Run evals
        if: env.GEMINI_API_KEY != ''
        run: python -m evals --rpm ${{ vars.EVAL_RPM || 30 }}
      - name: Report
        if: always() && env.GEMINI_API_KEY != ''
        run: cat evals/reports/latest.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always() && env.GEMINI_API_KEY != ''
        with:
          name: eval-report
          path: backend/evals/reports/
