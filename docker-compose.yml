name: vaani

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: vaani_admin
      POSTGRES_PASSWORD: vaani_admin
      POSTGRES_DB: vaani
    # 5435 on the host so it doesn't clash with a locally installed Postgres.
    ports: ["127.0.0.1:5435:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaani_admin -d vaani"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Local LiveKit server for browser voice calls (dev keys: devkey / secret).
  # --node-ip makes WebRTC media use localhost; 7882/udp carries the audio.
  livekit:
    image: livekit/livekit-server:v1.13.10
    command: --dev --bind 0.0.0.0 --node-ip 127.0.0.1
    ports:
      - "127.0.0.1:7880:7880"
      - "127.0.0.1:7881:7881"
      - "127.0.0.1:7882:7882/udp"

  api:
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://vaani_app:vaani_app@db:5432/vaani
      ADMIN_DATABASE_URL: postgresql+psycopg://vaani_admin:vaani_admin@db:5432/vaani
    depends_on:
      db:
        condition: service_healthy
    ports: ["8000:8000"]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
